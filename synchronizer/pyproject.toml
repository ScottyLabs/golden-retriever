[project]
name = "golden-retriever-synchronizer"
version = "0.1.0"
description = "Governance synchronizer for Slack (public/private channel invites)"
requires-python = ">=3.11"
dependencies = [
  "slack-sdk>=3.35.0",
]

[project.scripts]
sync = "sync:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
