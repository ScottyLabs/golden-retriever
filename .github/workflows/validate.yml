name: Validate

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-editorconfig:
    name: Check EditorConfig Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install EditorConfig Checker
        run: |
          EC_VERSION="3.6.1"
          curl -fsSL "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${EC_VERSION}/ec-linux-amd64.tar.gz" \
            | tar xzf - --strip-components=1
          sudo mv ec-linux-amd64 /usr/local/bin/editorconfig-checker

      - name: Check EditorConfig Compliance
        run: editorconfig-checker --exclude LICENSE --exclude '.terraform' --exclude 'scripts/secrets'

  validate-json:
    name: Validate JSON Files
    needs: validate-editorconfig
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Check JSON syntax
        run: |
          exit_code=0
          for f in contributors/*.json repos/*.json figma-projects/*.json google-files/*.json teams/*.json; do
            [ -f "$f" ] || continue
            if ! python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "::error file=$f::Invalid JSON syntax"
              exit_code=1
            fi
          done
          exit $exit_code

      - name: Validate contributors against schema
        run: |
          shopt -s nullglob
          files=(contributors/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            ajv validate -s schemas/contributor.schema.json -d "contributors/*.json" --strict=false
          fi

      - name: Validate repositories against schema
        run: |
          shopt -s nullglob
          files=(repos/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            ajv validate -s schemas/repository.schema.json -d "repos/*.json" --strict=false
          fi

      - name: Validate Figma projects against schema
        run: |
          shopt -s nullglob
          files=(figma-projects/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            ajv validate -s schemas/figma-project.schema.json -d "figma-projects/*.json" --strict=false
          fi

      - name: Validate Google files against schema
        run: |
          shopt -s nullglob
          files=(google-files/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            ajv validate -s schemas/google-file.schema.json -d "google-files/*.json" --strict=false
          fi

      - name: Validate teams against schema
        run: |
          shopt -s nullglob
          files=(teams/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            ajv validate -s schemas/team.schema.json -d "teams/*.json" --strict=false
          fi

  validate-terraform:
    name: Validate Terraform
    needs: validate-json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  validate-references:
    name: Validate Cross-References
    needs: validate-json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check that team member and repo references are valid
        run: |
          exit_code=0

          for team_file in teams/*.json; do
            [ -f "$team_file" ] || continue
            team_slug=$(basename "$team_file" .json)

            # Check slug matches filename
            file_slug=$(python3 -c "import json; print(json.load(open('$team_file'))['slug'])")
            if [ "$file_slug" != "$team_slug" ]; then
              echo "::error file=$team_file::slug '$file_slug' does not match filename '$team_slug'"
              exit_code=1
            fi

            # Check all contributors reference existing contributor files
            for contributor in $(python3 -c "import json; [print(c) for c in json.load(open('$team_file')).get('contributors', [])]"); do
              if [ ! -f "contributors/$contributor.json" ]; then
                echo "::error file=$team_file::contributor '$contributor' has no file at contributors/$contributor.json"
                exit_code=1
              fi
            done

            # Check all maintainers reference existing contributor files
            for maintainer in $(python3 -c "import json; [print(m) for m in json.load(open('$team_file')).get('maintainers', [])]"); do
              if [ ! -f "contributors/$maintainer.json" ]; then
                echo "::error file=$team_file::maintainer '$maintainer' has no file at contributors/$maintainer.json"
                exit_code=1
              fi
            done

            # Check all maintainers are also listed as contributors
            python3 -c "
          import json, sys
          team = json.load(open('$team_file'))
          maintainers = set(team.get('maintainers', []))
          contributors = set(team.get('contributors', []))
          missing = maintainers - contributors
          for m in missing:
              print(f'::error file=$team_file::maintainer \"{m}\" must also be listed in contributors')
              sys.exit(1)
          "

            # Check all repos reference existing repo files
            for repo in $(python3 -c "import json; [print(r) for r in json.load(open('$team_file')).get('repos', [])]"); do
              if [ ! -f "repos/$repo.json" ]; then
                echo "::error file=$team_file::repo '$repo' has no file at repos/$repo.json"
                exit_code=1
              fi
            done

            # Check all figma_projects reference existing figma-project files
            for fp in $(python3 -c "import json; [print(p) for p in json.load(open('$team_file')).get('figma_projects', [])]"); do
              if [ ! -f "figma-projects/$fp.json" ]; then
                echo "::error file=$team_file::figma_project '$fp' has no file at figma-projects/$fp.json"
                exit_code=1
              fi
            done

            # Check all google_files reference existing google-file files
            for gf in $(python3 -c "import json; [print(g) for g in json.load(open('$team_file')).get('google_files', [])]"); do
              if [ ! -f "google-files/$gf.json" ]; then
                echo "::error file=$team_file::google_file '$gf' has no file at google-files/$gf.json"
                exit_code=1
              fi
            done

            # Check ext_admins reference existing contributor files
            for x in $(python3 -c "import json; [print(v) for v in json.load(open('$team_file')).get('ext_admins', [])]"); do
              if [ ! -f "contributors/$x.json" ]; then
                echo "::error file=$team_file::ext_admin '$x' has no file at contributors/$x.json"
                exit_code=1
              fi
            done

            # Check applicants reference existing contributor files
            for a in $(python3 -c "import json; [print(v) for v in json.load(open('$team_file')).get('applicants', [])]"); do
              if [ ! -f "contributors/$a.json" ]; then
                echo "::error file=$team_file::applicant '$a' has no file at contributors/$a.json"
                exit_code=1
              fi
            done
          done

          # Check contributor slug matches filename
          for contrib_file in contributors/*.json; do
            [ -f "$contrib_file" ] || continue
            expected=$(basename "$contrib_file" .json)
            github_user=$(python3 -c "import json; print(json.load(open('$contrib_file')).get('github_username', ''))")
            if [ -n "$github_user" ] && [ "$github_user" != "$expected" ]; then
              echo "::warning file=$contrib_file::github_username '$github_user' does not match filename '$expected'"
            fi
          done

          # Check repo slug matches filename
          for repo_file in repos/*.json; do
            [ -f "$repo_file" ] || continue
            expected=$(basename "$repo_file" .json)
            file_slug=$(python3 -c "import json; print(json.load(open('$repo_file'))['slug'])")
            if [ "$file_slug" != "$expected" ]; then
              echo "::error file=$repo_file::slug '$file_slug' does not match filename '$expected'"
              exit_code=1
            fi
          done

          # Check google-file slug matches filename
          for gf_file in google-files/*.json; do
            [ -f "$gf_file" ] || continue
            expected=$(basename "$gf_file" .json)
            file_slug=$(python3 -c "import json; print(json.load(open('$gf_file'))['slug'])")
            if [ "$file_slug" != "$expected" ]; then
              echo "::error file=$gf_file::slug '$file_slug' does not match filename '$expected'"
              exit_code=1
            fi
          done

          # Check figma-project slug matches filename
          for fp_file in figma-projects/*.json; do
            [ -f "$fp_file" ] || continue
            expected=$(basename "$fp_file" .json)
            file_slug=$(python3 -c "import json; print(json.load(open('$fp_file'))['slug'])")
            if [ "$file_slug" != "$expected" ]; then
              echo "::error file=$fp_file::slug '$file_slug' does not match filename '$expected'"
              exit_code=1
            fi
          done

          exit $exit_code

  validate-figma:
    name: Verify Figma Projects
    needs: validate-references
    if: vars.FIGMA_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Figma project IDs exist
        env:
          FIGMA_TOKEN: ${{ vars.FIGMA_TOKEN }}
        run: |
          exit_code=0
          for fp_file in figma-projects/*.json; do
            [ -f "$fp_file" ] || continue
            slug=$(basename "$fp_file" .json)
            project_id=$(python3 -c "import json; print(json.load(open('$fp_file'))['figma_project_id'])")

            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "X-Figma-Token: $FIGMA_TOKEN" \
              "https://api.figma.com/v1/projects/$project_id/files")

            if [ "$status" = "200" ]; then
              echo "OK: $slug (project $project_id)"
            elif [ "$status" = "403" ]; then
              echo "::warning file=$fp_file::Figma project $project_id exists but token lacks access"
            else
              echo "::error file=$fp_file::Figma project $project_id returned HTTP $status (not found or invalid)"
              exit_code=1
            fi
          done
          exit $exit_code
